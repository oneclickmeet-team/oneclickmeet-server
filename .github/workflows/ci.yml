name: ci.yml

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: oneclickmeet_test
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping --protocol=TCP --host=127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: test
          MYSQL_PORT: "3306"
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD }}
        run: ./gradlew build

      - name: Check tool versions
        run: |
          java --version
          ./gradlew --version