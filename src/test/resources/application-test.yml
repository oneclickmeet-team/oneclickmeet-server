spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/oneclickmeet_test
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  config:
    import: "file:./.env.local[.properties]"